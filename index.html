<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Spider-Man: NYC</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #000;
    font-family: 'Segoe UI', Arial, sans-serif; color: #fff;
    touch-action: none; user-select: none;
  }
  #menu {
    position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    background: radial-gradient(circle at 50% 50%, rgba(10,5,10,0.18) 0%, rgba(10,5,10,0.65) 60%, rgba(10,5,10,0.92) 100%);
    padding: 24px 20px 24px; pointer-events: none;
  }
  #menu > * { pointer-events: auto; }
  #menu h1 {
    margin: 0; font-size: clamp(32px, 6vw, 64px); font-weight: 900;
    font-style: italic; letter-spacing: 4px; text-shadow: 0 0 25px #f00;
  }
  #menu p { opacity: .7; letter-spacing: 3px; font-size: 13px; }
  #suits { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .suit {
    width: 180px; padding: 12px; border-radius: 12px;
    background: rgba(255,255,255,.06); border: 2px solid rgba(255,255,255,.15);
    cursor: pointer; text-align: center; transition: transform .15s, border-color .15s;
  }
  .suit:hover { transform: translateY(-3px); }
  .suit.sel { border-color: #e11; box-shadow: 0 0 25px rgba(255,0,0,.5); }
  .suit .sw { height: 80px; border-radius: 8px; margin-bottom: 8px; }
  .suit small { opacity: .65; }
  #play {
    margin-top: 24px; padding: 14px 60px; font-size: 20px; font-weight: 800;
    letter-spacing: 3px; border: 0; border-radius: 40px;
    background: linear-gradient(90deg, #a00, #f22); color: #fff; cursor: pointer;
    box-shadow: 0 0 30px rgba(255,0,0,.5); transition: transform .15s;
  }
  #play:hover { transform: scale(1.04); }
  #load { margin-top: 10px; font-size: 12px; opacity: .7; height: 16px; }
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 5; }
  #tl { position: absolute; top: 14px; left: 16px; font-size: 11px; font-weight: 800; letter-spacing: 2px; font-style: italic; }
  #hp { width: 220px; height: 5px; background: rgba(255,255,255,.2); margin-top: 5px; border-radius: 2px; overflow: hidden; }
  #hp i { display: block; height: 100%; background: #fff; width: 100%; transition: width .15s; }
  #tr { position: absolute; top: 14px; right: 16px; text-align: right; }
  #dist { font-size: 12px; font-weight: 800; letter-spacing: 2px; color: #ff4a4a; }
  #obj { font-size: 12px; opacity: .85; margin-top: 3px; }
  #mapw { position: absolute; left: 16px; bottom: 16px; width: 150px; height: 150px; border-radius: 50%; overflow: hidden; border: 3px solid rgba(255,255,255,.35); background: #1c3d55; }
  #spd { position: absolute; left: 180px; bottom: 22px; font-size: 30px; font-weight: 900; font-style: italic; }
  #spd small { display: block; font-size: 10px; letter-spacing: 2px; opacity: .7; font-style: normal; }
  #aim {
    position: absolute; width: 22px; height: 22px; margin: -11px;
    border: 2px solid #fff; border-radius: 50%; opacity: 0;
    transition: opacity .15s; pointer-events: none;
  }
  #aim::after { content: ''; position: absolute; left: 7px; top: 7px; width: 4px; height: 4px; background: #fff; border-radius: 50%; }
  #tip {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: 2px; background: rgba(0,0,0,.5);
    padding: 6px 12px; border-radius: 4px; white-space: nowrap;
  }
  #touch { display: none; position: fixed; inset: 0; z-index: 6; pointer-events: none; }
  #joy {
    position: absolute; left: 28px; bottom: 36px; width: 140px; height: 140px;
    border-radius: 50%; background: rgba(255,255,255,.08);
    border: 2px solid rgba(255,255,255,.3); pointer-events: auto;
  }
  #knob { position: absolute; left: 45px; top: 45px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.55); }
  .tb {
    position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 12px; background: rgba(255,255,255,.12);
    border: 2px solid rgba(255,255,255,.4); pointer-events: auto;
  }
  .tb.on { background: rgba(225,17,17,.65); }
  #bWeb { right: 36px; bottom: 56px; width: 96px; height: 96px; background: rgba(200,0,0,.35); }
  #bJump { right: 148px; bottom: 28px; width: 64px; height: 64px; }
  #bZip { right: 148px; bottom: 110px; width: 60px; height: 60px; }
  #bSpr { right: 46px; bottom: 168px; width: 60px; height: 60px; font-size: 10px; }
  @media(max-width:700px){
    #mapw { width: 96px; height: 96px; top: 50px; right: 10px; left: auto; bottom: auto; }
    #spd { left: auto; right: 16px; top: 155px; bottom: auto; }
    #tip { display: none; }
    #hp { width: 130px; }
  }
</style>
</head>
<body>
<div id="menu">
  <div style="text-align:center;">
    <h1>SPIDER-MAN <span style="color:#e11">NYC</span></h1>
    <p style="margin:4px 0 0;font-size:12px;opacity:0.8;letter-spacing:3px;">CHOOSE YOUR SUIT</p>
  </div>
  <div id="suits"></div>
  <div style="text-align:center;display:flex;flex-direction:column;align-items:center;">
    <button id="play">PLAY</button>
    <div id="load"></div>
    <div style="font-size:11px;letter-spacing:2px;opacity:0.7;margin-top:6px;">↔ DRAG BACKGROUND TO ROTATE 3D MODEL</div>
  </div>
</div>

<div id="hud">
  <div id="tl"><span id="hname">SPIDER-MAN</span><div id="hp"><i></i></div></div>
  <div id="tr"><div id="dist">MIDTOWN</div><div id="obj">Free roam · Reach the Empire State spire</div></div>
  <div id="mapw"><canvas id="map" width="300" height="300" style="width:100%;height:100%"></canvas></div>
  <div id="spd"><span id="spv">0</span><small>KM/H</small></div>
  <div id="aim"></div>
  <div id="tip">AIM WITH MOUSE · HOLD LMB SWING · A/D STEER · RMB/Q ZIP · SPACE JUMP · SHIFT SPRINT</div>
</div>

<div id="touch">
  <div id="joy"><div id="knob"></div></div>
  <div class="tb" id="bWeb">WEB</div>
  <div class="tb" id="bJump">JUMP</div>
  <div class="tb" id="bZip">ZIP</div>
  <div class="tb" id="bSpr">SPRINT</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ================= SOUND EFFECTS ================= */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playThwip() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(820, now);
  osc.frequency.exponentialRampToValueAtTime(140, now + 0.13);
  gain.gain.setValueAtTime(0.28, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.13);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.14);
}

/* ================= SUITS ================= */
const SUITS = {
  tom: {
    name: 'HOMECOMING', sub: 'Tom Holland era',
    model: 'models/tom.glb',
    main: '#c8101c', sec: '#15307f', web: '#0a0a0a', eye: 0xffffff, lineW: 2
  },
  tobey: {
    name: 'CLASSIC 2002', sub: 'Tobey Maguire era',
    model: 'models/tobey.glb',
    texture: 'models/raimi_diffuse.png',
    bumpMap: 'models/raimi_bump.png',
    main: '#8f0b12', sec: '#0e2466', web: '#2a2a2a', eye: 0xbfc9d4, lineW: 4, raised: true
  },
  andrew: {
    name: 'AMAZING', sub: 'Andrew Garfield era',
    model: 'models/andrew.glb',
    main: '#d4121a', sec: '#1a55c9', web: '#111', eye: 0xf0b93a, lineW: 2
  }
};
let suitKey = 'tom';
const sd = document.getElementById('suits');
for (const k in SUITS) {
  const s = SUITS[k], d = document.createElement('div');
  d.className = 'suit' + (k === suitKey ? ' sel' : '');
  const bg = s.texture ? `url(${s.texture}) center/cover` : `linear-gradient(135deg,${s.main} 55%,${s.sec} 55%)`;
  d.innerHTML = `<div class="sw" style="background:${bg}"></div><b>${s.name}</b><br><small>${s.sub}</small>`;
  d.onclick = () => {
    if (suitKey === k) return;
    suitKey = k;
    document.querySelectorAll('.suit').forEach(e => e.classList.remove('sel'));
    d.classList.add('sel');
    loadHero(SUITS[k]);
  };
  sd.appendChild(d);
}

/* ================= RENDERER ================= */
const isTouch = matchMedia('(pointer:coarse)').matches;
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.25 : 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const FOG = 0xd9c3aa;
scene.fog = new THREE.FogExp2(FOG, 0.0016);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 2500);
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(2000, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      top: { value: new THREE.Color(0x4b7fc4) },
      hor: { value: new THREE.Color(0xf1cfa6) },
      sunDir: { value: new THREE.Vector3(-0.5, 0.35, 0.3).normalize() }
    },
    vertexShader: `varying vec3 v;void main(){v=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader: `uniform vec3 top,hor,sunDir;varying vec3 v;void main(){float h=max(v.y,0.);vec3 c=mix(hor,top,pow(h,.5)); float s=max(dot(v,sunDir),0.);c+=vec3(1.,.8,.5)*(pow(s,300.)*3.+pow(s,8.)*.35);gl_FragColor=vec4(c,1.);}`
  })
);
scene.add(sky);

scene.add(new THREE.HemisphereLight(0xc4d8ff, 0x5a4a3a, 0.8));
const sun = new THREE.DirectionalLight(0xffdcb0, 2.8);
sun.castShadow = true;
sun.shadow.mapSize.set(isTouch ? 1024 : 2048, isTouch ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, near: 1, far: 500 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.05;
scene.add(sun, sun.target);

// Showcase studio lights for 3D hero inspection in menu
const showcaseLight = new THREE.DirectionalLight(0xfff2e0, 2.5);
showcaseLight.position.set(2, 2.8, 153.5);
scene.add(showcaseLight);

const showcaseRim = new THREE.DirectionalLight(0x77aaff, 1.8);
showcaseRim.position.set(-2, 2.2, 147);
scene.add(showcaseRim);

let composer = null;
if (!isTouch) {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.35, 0.6, 0.85));
  composer.addPass(new OutputPass());
}

/* ================= FACADE TEXTURES ================= */
function facade(type) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const P = {
    brick: { wall: '#8b4f3a', frame: '#e4dccb', glass: '#2b3848', band: '#c9bda3' },
    brown: { wall: '#6a4232', frame: '#d6cbb5', glass: '#26313d', band: '#a8927a' },
    lime:  { wall: '#cdc3ad', frame: '#9a917f', glass: '#34414f', band: '#e6ddc8' },
    grey:  { wall: '#8e9094', frame: '#55585d', glass: '#223242', band: '#b0b2b5' },
    glass: { wall: '#1f2b38', frame: '#5d6b78', glass: '#6f93b5', band: '#3a4754' }
  }[type];

  g.fillStyle = P.wall; g.fillRect(0, 0, 256, 256);
  if (type === 'brick' || type === 'brown') {
    for (let y = 0; y < 256; y += 4) {
      for (let x = (y / 4 % 2) * 4; x < 256; x += 8) {
        g.fillStyle = `rgba(${Math.random() < .5 ? '0,0,0' : '255,255,255'},${Math.random() * .08})`;
        g.fillRect(x, y, 7, 3);
      }
    }
  }
  if (type === 'glass') {
    for (let x = 0; x < 4; x++) {
      for (let y = 0; y < 4; y++) {
        const gr = g.createLinearGradient(0, y * 64, 0, y * 64 + 60);
        gr.addColorStop(0, '#9dbad4');
        gr.addColorStop(1, Math.random() < .1 ? '#e8c27a' : '#3d5873');
        g.fillStyle = gr;
        g.fillRect(x * 64 + 2, y * 64 + 2, 60, 58);
      }
    }
  } else {
    for (let y = 0; y < 4; y++) {
      g.fillStyle = P.band;
      g.fillRect(0, y * 64 + 58, 256, 6);
      for (let x = 0; x < 4; x++) {
        const wx = x * 64 + 16, wy = y * 64 + 10;
        g.fillStyle = P.frame;
        g.fillRect(wx - 3, wy - 3, 38, 46);
        const lit = Math.random() < 0.12;
        const gr = g.createLinearGradient(wx, wy, wx + 32, wy + 40);
        gr.addColorStop(0, lit ? '#ffe2a0' : '#6d8298');
        gr.addColorStop(1, lit ? '#e6a950' : P.glass);
        g.fillStyle = gr;
        g.fillRect(wx, wy, 32, 40);
        g.fillStyle = P.frame;
        g.fillRect(wx + 15, wy, 2, 40);
        g.fillRect(wx, wy + 18, 32, 2);
        g.fillStyle = 'rgba(0,0,0,.35)';
        g.fillRect(wx - 4, wy + 43, 40, 3);
      }
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

const TYPES = ['brick', 'brown', 'lime', 'grey', 'glass'];
const facadeMats = {};
for (const t of TYPES) {
  facadeMats[t] = new THREE.MeshStandardMaterial({
    map: facade(t),
    roughness: t === 'glass' ? .15 : .85,
    metalness: t === 'glass' ? .6 : .05
  });
}
const roofMat = new THREE.MeshStandardMaterial({ color: 0x5b5a57, roughness: .95 });
const trimMat = new THREE.MeshStandardMaterial({ color: 0xb8ad98, roughness: .8 });
const acMat   = new THREE.MeshStandardMaterial({ color: 0xa3a6a8, roughness: .6, metalness: .4 });
const tankMat = new THREE.MeshStandardMaterial({ color: 0x6b4a32, roughness: .95 });

/* ================= MANHATTAN ================= */
const buildings = [], webTargets = [];
const AVE = 70, ST = 36, ROAD = 14, XMIN = -245, XMAX = 245, ZMIN = -780, ZMAX = 580;
const PARK = { minX: -105, maxX: 105, minZ: -580, maxZ: -310 };

const asphalt = new THREE.Mesh(
  new THREE.PlaneGeometry(XMAX - XMIN + 40, ZMAX - ZMIN + 40),
  new THREE.MeshStandardMaterial({ color: 0x2a2a2d, roughness: .95 })
);
asphalt.rotation.x = -Math.PI / 2;
asphalt.position.z = (ZMIN + ZMAX) / 2;
asphalt.receiveShadow = true;
scene.add(asphalt);

const water = new THREE.Mesh(
  new THREE.PlaneGeometry(6000, 6000),
  new THREE.MeshStandardMaterial({ color: 0x27495f, roughness: .1, metalness: .8 })
);
water.rotation.x = -Math.PI / 2;
water.position.y = -0.8;
scene.add(water);

// road markings
const dashGeo = new THREE.PlaneGeometry(0.35, 3);
dashGeo.rotateX(-Math.PI / 2);
const dashes = new THREE.InstancedMesh(dashGeo, new THREE.MeshBasicMaterial({ color: 0xe8e2d0 }), 6000);
const cwGeo = new THREE.PlaneGeometry(0.9, 5);
cwGeo.rotateX(-Math.PI / 2);
const cws = new THREE.InstancedMesh(cwGeo, new THREE.MeshBasicMaterial({ color: 0xdedede }), 9000);
const D = new THREE.Object3D();
let di = 0, ci = 0;
for (let x = XMIN; x <= XMAX; x += AVE) {
  for (let z = ZMIN; z < ZMAX; z += 7) {
    D.position.set(x, 0.03, z);
    D.rotation.set(0, 0, 0);
    D.updateMatrix();
    if (di < 6000) dashes.setMatrixAt(di++, D.matrix);
  }
}
for (let x = XMIN; x <= XMAX; x += AVE) {
  for (let z = ZMIN; z <= ZMAX; z += ST) {
    for (let k = -5; k <= 5; k++) {
      D.position.set(x + k * 1.2, 0.03, z + ROAD / 2 - 3);
      D.updateMatrix();
      if (ci < 9000) cws.setMatrixAt(ci++, D.matrix);
    }
  }
}
dashes.count = di; cws.count = ci;
scene.add(dashes, cws);

// Central Park
const park = new THREE.Mesh(
  new THREE.PlaneGeometry(PARK.maxX - PARK.minX, PARK.maxZ - PARK.minZ),
  new THREE.MeshStandardMaterial({ color: 0x4a7a36, roughness: 1 })
);
park.rotation.x = -Math.PI / 2;
park.position.set(0, .06, (PARK.minZ + PARK.maxZ) / 2);
park.receiveShadow = true;
scene.add(park);

const lake = new THREE.Mesh(new THREE.CircleGeometry(30, 32), water.material);
lake.rotation.x = -Math.PI / 2;
lake.position.set(10, .1, -480);
scene.add(lake);

const trees = new THREE.InstancedMesh(
  new THREE.IcosahedronGeometry(3.2, 1),
  new THREE.MeshStandardMaterial({ color: 0x3a6e2c, roughness: 1, flatShading: true }),
  420
);
for (let i = 0; i < 420; i++) {
  let x, z;
  if (i < 300) {
    x = PARK.minX + 5 + Math.random() * (PARK.maxX - PARK.minX - 10);
    z = PARK.minZ + 5 + Math.random() * (PARK.maxZ - PARK.minZ - 10);
  } else {
    x = XMIN + Math.floor(Math.random() * 8) * AVE + (Math.random() < .5 ? -5.5 : 5.5);
    z = ZMIN + Math.random() * (ZMAX - ZMIN);
  }
  if (Math.hypot(x - 10, z + 480) < 32) continue;
  D.position.set(x, 3.5, z);
  const s = .6 + Math.random() * .7;
  D.scale.set(s, s * 1.2, s);
  D.updateMatrix();
  trees.setMatrixAt(i, D.matrix);
}
trees.castShadow = true;
scene.add(trees);

function heightAt(x, z) {
  const mid = Math.exp(-((z + 60) ** 2) / (2 * 150 ** 2)) * 170;
  const fidi = Math.exp(-((z - 480) ** 2) / (2 * 70 ** 2)) * 190;
  return Math.max(18, (22 + mid + fidi) * (1 - Math.abs(x) / 245 * .35) * (.4 + Math.random() * .8));
}

function box(w, h, d, mat, x, y, z, collide = true) {
  const geo = new THREE.BoxGeometry(w, h, d);
  if (!Array.isArray(mat) && mat.map) {
    const uv = geo.attributes.uv, n = geo.attributes.normal;
    for (let i = 0; i < uv.count; i++) {
      const side = Math.abs(n.getX(i)) > .5 ? d : w;
      const top = Math.abs(n.getY(i)) > .5;
      uv.setXY(i, top ? 0 : uv.getX(i) * side / 14, top ? 0 : uv.getY(i) * h / 14);
    }
    mat = [mat, mat, roofMat, roofMat, mat, mat];
  }
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y + h / 2, z);
  m.castShadow = m.receiveShadow = true;
  scene.add(m);
  if (collide) {
    webTargets.push(m);
    buildings.push({ minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2, base: y, h: y + h });
  }
  return m;
}

function tower(x, z, w, d, h) {
  const type = h > 120 ? (Math.random() < .5 ? 'glass' : 'lime') : TYPES[(Math.random() * 4) | 0];
  const mat = facadeMats[type];
  let y = 0, cw = w, cd = d, remaining = h;
  const tiers = h > 90 ? 3 : h > 50 ? 2 : 1;
  for (let t = 0; t < tiers; t++) {
    const th = t === tiers - 1 ? remaining : remaining * (t === 0 ? .55 : .6);
    box(cw, th, cd, mat, x, y, z);
    y += th; remaining -= th;
    if (type !== 'glass') box(cw + .8, 1.2, cd + .8, trimMat, x, y - 1.2, z, false);
    cw *= .78; cd *= .78;
  }
  box(cw / .78, 1, .4, trimMat, x, y, z - cd / .78 / 2, false);
  box(cw / .78, 1, .4, trimMat, x, y, z + cd / .78 / 2, false);
  for (let i = 0; i < 2 + Math.random() * 3; i++) {
    box(2.5, 1.6, 2, acMat, x + (Math.random() - .5) * cw * .8, y, z + (Math.random() - .5) * cd * .8, false);
  }
  if (h < 110 && Math.random() < .45) {
    const tk = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.8, 3.5, 12), tankMat);
    tk.position.set(x + cw * .2, y + 4.5, z);
    tk.castShadow = true; scene.add(tk);
    const cone = new THREE.Mesh(new THREE.ConeGeometry(2, 1.4, 12), tankMat);
    cone.position.set(x + cw * .2, y + 6.9, z);
    scene.add(cone);
    box(.25, 2.7, .25, acMat, x + cw * .2 - 1.2, y, z, false);

function suitTex(s) {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = s.main; g.fillRect(0, 0, 512, 512);
  g.strokeStyle = s.web; g.lineWidth = s.lineW;
  for (let x = 0; x <= 512; x += 32) {
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 512); g.stroke();
  }
  for (let yy = 0; yy <= 512; yy += 28) {
    g.beginPath();
    for (let x = 0; x <= 512; x += 2) {
      const q = yy + 6 * Math.sin((x % 32) / 32 * Math.PI);
      x ? g.lineTo(x, q) : g.moveTo(x, q);
    }
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(1.5, 1.5);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

let currentLoadId = 0;
let modelBaseY = 0;

function loadHero(s) {
  const loadId = ++currentLoadId;
  return new Promise(res => {
    while (hero.children.length) hero.remove(hero.children[0]);
    rig = null; mixer = null; actions = {}; curAct = null; handBone = null;
    const loadEl = document.getElementById('load');
    if (loadEl) loadEl.textContent = 'Loading ' + s.name + ' 3D model ...';

    const baseName = s.model.split('/').pop();
    const candidatePaths = [
      s.model,
      'models/' + baseName,
      'public/models/' + baseName
    ];
    // Also add known original filenames as fallbacks
    if (s.name.includes('HOMECOMING')) {
      candidatePaths.push('models/spider-man_2017_homecoming_-_tech_suit.glb', 'public/models/spider-man_2017_homecoming_-_tech_suit.glb');
    } else if (s.name.includes('CLASSIC')) {
      candidatePaths.push('models/spider man 2004 raimi Trilogy.glb', 'public/models/spider man 2004 raimi Trilogy.glb');
    } else if (s.name.includes('AMAZING')) {
      candidatePaths.push('models/the_amazing_spider-man_2_spider-man.glb', 'public/models/the_amazing_spider-man_2_spider-man.glb');
    }
    const pathsToTry = [...new Set(candidatePaths)];

    function tryLoad(idx) {
      if (idx >= pathsToTry.length) {
        console.warn('Could not load 3D GLB model for ' + s.name + ', falling back to procedural athletic model.');
        if (loadId === currentLoadId) {
          if (loadEl) loadEl.textContent = '';
          buildFallback(s);
        }
        res();
        return;
      }

      loader.load(
        pathsToTry[idx],
        gltf => {
          if (loadId !== currentLoadId) return;
          const m = gltf.scene;

          m.updateMatrixWorld(true);
          const bb = new THREE.Box3().setFromObject(m);
          const size = new THREE.Vector3();
          bb.getSize(size);
          const height = size.y;
          const targetHeight = 1.85;
          const scale = height > 0.05 ? (targetHeight / height) : 1;
          m.scale.setScalar(scale);
          m.updateMatrixWorld(true);

          const scaledBox = new THREE.Box3().setFromObject(m);
          const center = new THREE.Vector3();
          scaledBox.getCenter(center);

          // Center horizontally and place feet flat on ground
          m.position.x = -center.x;
          m.position.y = -scaledBox.min.y;
          m.position.z = -center.z;
          modelBaseY = m.position.y;

          // Texture loader for custom maps (e.g. Raimi diffuse & bump)
          const texLoader = new THREE.TextureLoader();
          let diffuseTex = null, bumpTex = null;
          if (s.texture) {
            diffuseTex = texLoader.load(s.texture);
            diffuseTex.colorSpace = THREE.SRGBColorSpace;
            diffuseTex.flipY = false;
          }
          if (s.bumpMap) {
            bumpTex = texLoader.load(s.bumpMap);
            bumpTex.flipY = false;
          }

          m.traverse(o => {
            if (o.isMesh) {
              o.castShadow = true;
              o.receiveShadow = true;

              // Vertex colors support (e.g. Nomad sculpt Raimi mesh)
              if (o.geometry && o.geometry.attributes.color) {
                if (o.material) {
                  o.material.vertexColors = true;
                  o.material.needsUpdate = true;
                }
              }

              // Apply diffuse & bump if provided and mesh has UVs
              if (o.material && o.geometry && o.geometry.attributes.uv) {
                if (diffuseTex) {
                  o.material.map = diffuseTex;
                  o.material.needsUpdate = true;
                }
                if (bumpTex) {
                  o.material.bumpMap = bumpTex;
                  o.material.bumpScale = 0.04;
                  o.material.needsUpdate = true;
                }
              }

              // Ensure double-sided rendering so all angles are visible
              if (o.material) {
                o.material.side = THREE.DoubleSide;
              }
            }
            if (o.isBone && /right.?hand/i.test(o.name)) handBone = o;
          });

          hero.add(m);

          // Animation setup if present
          if (gltf.animations && gltf.animations.length > 0) {
            mixer = new THREE.AnimationMixer(m);
            for (const c of gltf.animations) {
              const n = c.name.toLowerCase();
              for (const k of ['idle', 'run', 'swing', 'fall']) {
                if (n.includes(k)) actions[k] = mixer.clipAction(c);
              }
            }
            playAct('idle');
          }

          if (loadEl) loadEl.textContent = s.name + ' Ready!';
          res();
        },
        undefined,
        () => {
          tryLoad(idx + 1);
        }
      );
    }

    tryLoad(0);
  });
}

function playAct(n) {
  const a = actions[n] || actions.idle;
  if (!a || a === curAct) return;
  a.reset().fadeIn(.25).play();

}

const pos = new THREE.Vector3(0, 0, 150), vel = new THREE.Vector3(), anchor = new THREE.Vector3();

const GRAV = -36, RC = .4, ray = new THREE.Raycaster(), UP = new THREE.Vector3(0, 1, 0);
const camFwd = () => { const d = new THREE.Vector3(); camera.getWorldDirection(d); return d; };

// CAMERA-AIMED anchor: searches a cone around view direction, biased by A/D steering
function findAnchor() {
  const origin = pos.clone().add(new THREE.Vector3(0, 1.6, 0));
  const f = camFwd().setY(0).normalize(), r = new THREE.Vector3().crossVectors(f, UP);
  const steer = inp.mx;
  let best = null, bestScore = -1e9;
  for (const side of [0, .25, -.25, .5, -.5, .8, -.8]) {
    for (const el of [.6, .8, 1.0, .45, 1.2]) {
      const h = f.clone().multiplyScalar(Math.cos(side)).addScaledVector(r, Math.sin(side));
      const dir = h.multiplyScalar(Math.cos(el)).addScaledVector(UP, Math.sin(el)).normalize();
      ray.set(origin, dir);
      ray.far = 90;
      const hit = ray.intersectObjects(webTargets, false)[0];
      if (!hit || hit.point.y < origin.y + 5) continue;
      const dist = hit.distance;
      const score = -Math.abs(side - steer * .5) * 40 - Math.abs(dist - 40) * .4 + (hit.point.y - origin.y) * .1;
      if (score > bestScore) {
        bestScore = score;
        best = hit.point.clone();
      }
    }
  }
  if (!best && pos.y > 6) {
    best = origin.clone().addScaledVector(f, 30).addScaledVector(r, steer * 12).add(new THREE.Vector3(0, 35, 0));
  }
  return best;
}

function webZip() {
  ray.set(camera.position, camFwd());
  ray.far = 200;
  const hit = ray.intersectObjects(webTargets, false)[0];
  if (!hit) return;
  anchor.copy(hit.point);
  swinging = false;
  zipT = .45;
  vel.copy(hit.point.clone().sub(pos).normalize().multiplyScalar(75));
  vel.y += 6;
  playThwip();
}
const angLerp = (a, b, t) => {
  const d = ((b - a + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
  return a + d * t;
};

/* ================= ANIMATION ================= */
const pose = { lAX: 0, lAZ: 0, rAX: 0, rAZ: 0, lE: 0, rE: 0, lL: 0, rL: 0, lK: 0, rK: 0, tilt: 0, roll: 0 };
let animT = 0;
function animate(dt) {
  const hs = Math.hypot(vel.x, vel.z);
  const state = onGround ? (hs > 1.5 ? 'run' : 'idle') : swinging ? 'swing' : 'fall';
  if (mixer && Object.keys(actions).length > 0) {
    playAct(state);
    if (curAct) curAct.timeScale = state === 'run' ? Math.max(.6, hs / 12) : 1;
    mixer.update(dt);
    if (hero.children[0]) hero.children[0].rotation.x = swinging ? Math.min(.5, hs * .01) : 0;
    return;
  }
  if (!rig) {
    if (hero.children[0]) {
      const m = hero.children[0];
      if (swinging) {
        m.rotation.x = THREE.MathUtils.lerp(m.rotation.x, Math.min(0.6, hs * 0.012), 1 - Math.exp(-dt * 10));
        m.rotation.z = THREE.MathUtils.lerp(m.rotation.z, -inp.mx * 0.4, 1 - Math.exp(-dt * 10));
        m.position.y = modelBaseY;
      } else if (onGround && hs > 1.5) {
        const bob = Math.sin(performance.now() * 0.015) * 0.03;
        m.position.y = modelBaseY + bob;
        m.rotation.x = THREE.MathUtils.lerp(m.rotation.x, 0.12, 1 - Math.exp(-dt * 10));
        m.rotation.z = THREE.MathUtils.lerp(m.rotation.z, 0, 1 - Math.exp(-dt * 10));
      } else {
        m.position.y = modelBaseY;
        m.rotation.x = THREE.MathUtils.lerp(m.rotation.x, 0, 1 - Math.exp(-dt * 10));
        m.rotation.z = THREE.MathUtils.lerp(m.rotation.z, 0, 1 - Math.exp(-dt * 10));
      }
    }
    return;
  }
  const t = {};
  if (onGround) {
    animT += dt * (5 + hs * .55);
    const a = Math.min(1, hs / 10), s = Math.sin(animT) * a;
    Object.assign(t, {
      lAX: -s * 1.1, rAX: s * 1.1, lAZ: .1, rAZ: -.1,
      lE: -.9 * a - .1, rE: -.9 * a - .1,
      lL: s, rL: -s, lK: Math.max(0, -s) * 1.5 + .1, rK: Math.max(0, s) * 1.5 + .1,

    });
  } else if (swinging) {
    Object.assign(t, {
      rAX: -2.95, rAZ: -.15, lAX: .6, lAZ: .9, lE: -1.2,
      lL: -1.2, rL: -.1, lK: 1.8, rK: .3,
      tilt: Math.min(.6, hs * .012), roll: -inp.mx * .35
    });
  } else if (zipT > 0) {
    Object.assign(t, { rAX: -3, lAX: -3, lL: .1, rL: .1, tilt: 1.3 });
  } else if (wall) {
    const s = Math.sin(performance.now() * .014);
    Object.assign(t, {
      lAX: -2.6 + s, rAX: -2.6 - s, lAZ: .3, rAZ: -.3,
      lE: -.7, rE: -.7, lL: -1 - s * .5, rL: -1 + s * .5,
      lK: 1.7, rK: 1.7, tilt: -.25
    });
  } else {
    Object.assign(t, {
      lAX: -.8, rAX: -.3, lAZ: 1.5, rAZ: -1.5, lE: -.5, rE: -.3,
      lL: -1, rL: .4, lK: 1.6, rK: .3, tilt: .6
    });
  }
  const k = 1 - Math.exp(-dt * 12);
  for (const q in pose) pose[q] += ((t[q] ?? 0) - pose[q]) * k;
  const { L, R, body } = rig;
  L.arm.sh.rotation.set(pose.lAX, 0, pose.lAZ); R.arm.sh.rotation.set(pose.rAX, 0, pose.rAZ);
  L.arm.el.rotation.x = pose.lE; R.arm.el.rotation.x = pose.rE;
  L.leg.hp.rotation.x = pose.lL; R.leg.hp.rotation.x = pose.rL;
  L.leg.kn.rotation.x = pose.lK; R.leg.kn.rotation.x = pose.rK;
  body.rotation.set(pose.tilt, 0, pose.roll);
}

/* ================= UPDATE ================= */
function update(dt) {
  if (!isTouch || joyId === null) {
    inp.mx = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
    inp.mz = (keys.KeyS ? 1 : 0) - (keys.KeyW ? 1 : 0);
  }
  inp.jump = keys.Space || tJump;
  inp.sprint = keys.ShiftLeft || keys.ShiftRight || tSpr;
  inp.web = mWeb || keys.KeyE || tWeb;

  const f = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  const r = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
  const mv = new THREE.Vector3().addScaledVector(f, -inp.mz).addScaledVector(r, inp.mx);
  if (mv.lengthSq() > 1) mv.normalize();

  if (inp.zip) { inp.zip = false; webZip(); }
  if (zipT > 0) zipT -= dt;

  if (inp.web && !swinging && zipT <= 0) {
    const a = findAnchor();
    if (a) {
      anchor.copy(a);
      swinging = true;
      ropeLen = pos.distanceTo(anchor) * .95;
      if (onGround) { vel.y = 16; onGround = false; }
      playThwip();
    }
  } else if (!inp.web && swinging) {
    swinging = false;
    // release: fling toward camera direction
    const cf = camFwd();
    cf.y = Math.max(cf.y, .15);
    vel.addScaledVector(cf.normalize(), 10);
    vel.y += 6;
  }

  if (onGround) {
    const sp = inp.sprint ? 28 : 12, k = Math.min(1, dt * 12);
    vel.x += (mv.x * sp - vel.x) * k;
    vel.z += (mv.z * sp - vel.z) * k;
    if (inp.jump) { vel.y = inp.sprint ? 21 : 16; onGround = false; }
  } else if (swinging) {
    vel.addScaledVector(f, 26 * dt * (inp.mz <= 0 ? 1 : -.5));
    vel.addScaledVector(r, inp.mx * 22 * dt);
  } else {
    vel.addScaledVector(mv, 12 * dt);
  }

  if (zipT <= 0) vel.y += GRAV * dt;
  if (wall && inp.mz < -.3 && !swinging) {
    vel.y = inp.sprint ? 20 : 12;
    vel.x -= wall.x * 2;
    vel.z -= wall.z * 2;
  }
  vel.multiplyScalar(1 - .05 * dt);

  const prevY = pos.y;
  pos.addScaledVector(vel, dt);

  if (swinging) {
    ropeLen = Math.max(8, ropeLen - dt * 4);
    const th = pos.clone().sub(anchor), d = th.length();
    if (d > ropeLen) {
      th.divideScalar(d);
      pos.copy(anchor).addScaledVector(th, ropeLen);
      const rv = vel.dot(th);
      if (rv > 0) vel.addScaledVector(th, -rv);
    }
  }

  onGround = false; wall = null;
  if (pos.y <= 0) {
    if (vel.y < -50) health = Math.max(.1, health - .2);
    pos.y = 0; vel.y = Math.max(vel.y, 0); onGround = true;
    if (pos.x < XMIN - 15 || pos.x > XMAX + 15 || pos.z < ZMIN - 15 || pos.z > ZMAX + 15) {
      pos.x = THREE.MathUtils.clamp(pos.x, XMIN, XMAX);
      pos.z = THREE.MathUtils.clamp(pos.z, ZMIN, ZMAX);
    }
  }

  for (const b of buildings) {
    if (pos.x > b.minX - RC && pos.x < b.maxX + RC &&
        pos.z > b.minZ - RC && pos.z < b.maxZ + RC &&
        pos.y < b.h && pos.y + 1.8 > b.base) {
      if (prevY >= b.h - .15) {
        pos.y = b.h; vel.y = Math.max(vel.y, 0); onGround = true;
      } else {
        const d = [pos.x - (b.minX - RC), b.maxX + RC - pos.x, pos.z - (b.minZ - RC), b.maxZ + RC - pos.z];
        const m = Math.min(...d);
        if (m === d[0])      { pos.x = b.minX - RC; vel.x = Math.min(vel.x, 0); wall = new THREE.Vector3(-1, 0, 0); }
        else if (m === d[1]) { pos.x = b.maxX + RC; vel.x = Math.max(vel.x, 0); wall = new THREE.Vector3(1, 0, 0); }
        else if (m === d[2]) { pos.z = b.minZ - RC; vel.z = Math.min(vel.z, 0); wall = new THREE.Vector3(0, 0, -1); }
        else                 { pos.z = b.maxZ + RC; vel.z = Math.max(vel.z, 0); wall = new THREE.Vector3(0, 0, 1); }
        zipT = 0;
      }
    }
  }

  health = Math.min(1, health + dt * .03);
  hero.position.copy(pos);
  const hs = Math.hypot(vel.x, vel.z);
  const face = wall && !onGround ? Math.atan2(-wall.x, -wall.z) :
               hs > 1 ? Math.atan2(vel.x, vel.z) :
               mv.lengthSq() ? Math.atan2(mv.x, mv.z) : hero.rotation.y;
  hero.rotation.y = angLerp(hero.rotation.y, face, 1 - Math.exp(-dt * 10));
  animate(dt);
}

function afterPhysics() {
  if (swinging || zipT > 0) {
    const hp = new THREE.Vector3();
    if (handBone) handBone.getWorldPosition(hp);
    else if (rig) rig.R.arm.hand.getWorldPosition(hp);
    else hp.copy(pos).y += 2;
    drawWeb(hp, anchor);
  } else {
    clearWeb();
  }
}

/* ================= CAMERA ================= */
const aimEl = document.getElementById('aim');
function updateCamera(dt) {
  const spd = vel.length(), target = pos.clone().add(new THREE.Vector3(0, 1.7, 0));
  const dist = 6 + Math.min(6, spd * .08);
  const off = new THREE.Vector3(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch));
  const sideOff = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)).multiplyScalar(.9); // over-the-shoulder
  const want = target.clone().add(sideOff).addScaledVector(off, dist);

  ray.set(target, want.clone().sub(target).normalize());
  ray.far = dist;
  const hit = ray.intersectObjects(webTargets, false)[0];
  if (hit) want.copy(target).addScaledVector(ray.ray.direction, Math.max(1.2, hit.distance - .5));

  camera.position.lerp(want, 1 - Math.exp(-dt * 14));
  camera.position.y = Math.max(.6, camera.position.y);
  camera.lookAt(target.clone().add(sideOff));

  camera.fov += ((68 + Math.min(24, spd * .32)) - camera.fov) * Math.min(1, dt * 4);
  camera.updateProjectionMatrix();

  sky.position.copy(camera.position);
  sun.position.copy(pos).add(new THREE.Vector3(-150, 180, 90));
  sun.target.position.copy(pos);

  // aim preview: show where next web will attach
  if ((!swinging && !onGround) || (inp.web && !swinging)) {
    const a = findAnchor();
    if (a) {
      const p = a.clone().project(camera);
      if (p.z < 1) {
        aimEl.style.opacity = .9;
        aimEl.style.left = (p.x * .5 + .5) * innerWidth + 'px';
        aimEl.style.top = (-p.y * .5 + .5) * innerHeight + 'px';
      } else {
        aimEl.style.opacity = 0;
      }
    } else {
      aimEl.style.opacity = 0;
    }
  } else {
    aimEl.style.opacity = 0;
  }
}

/* ================= HUD / MINIMAP ================= */
const mg = document.getElementById('map').getContext('2d');
function district(x, z) {
  if (z < PARK.maxZ && z > PARK.minZ && Math.abs(x) < PARK.maxX) return 'CENTRAL PARK';
  if (z < PARK.minZ) return 'HARLEM';
  if (z < -310) return 'UPPER WEST SIDE';
  if (z < -150) return 'TIMES SQUARE';
  if (z < 60) return 'MIDTOWN';
  if (z < 320) return 'GREENWICH VILLAGE';
  return 'FINANCIAL DISTRICT';
}

let hudT = 0;
function drawHUD(dt) {
  hudT += dt;
  if (hudT < .05) return;
  hudT = 0;

  mg.setTransform(1, 0, 0, 1, 0, 0);
  mg.fillStyle = '#1c3d55';
  mg.fillRect(0, 0, 300, 300);

  mg.translate(150, 150);
  mg.rotate(yaw);
  mg.scale(.6, .6);
  mg.translate(-pos.x, -pos.z);

  mg.fillStyle = '#3a3d44';
  mg.fillRect(XMIN - 10, ZMIN - 10, XMAX - XMIN + 20, ZMAX - ZMIN + 20);

  mg.fillStyle = '#3f6d33';
  mg.fillRect(PARK.minX, PARK.minZ, PARK.maxX - PARK.minX, PARK.maxZ - PARK.minZ);

  mg.fillStyle = '#9a9ca2';
  for (const b of buildings) {
    if (Math.abs(b.minX - pos.x) < 300 && Math.abs(b.minZ - pos.z) < 300 && b.base === 0) {
      mg.fillRect(b.minX, b.minZ, b.maxX - b.minX, b.maxZ - b.minZ);
    }
  }

  mg.fillStyle = '#ff3030';
  mg.beginPath();
  mg.arc(ESTOP.x, ESTOP.z, 8, 0, 7);
  mg.fill();

  mg.setTransform(1, 0, 0, 1, 0, 0);
  mg.fillStyle = '#fff';
  mg.beginPath();
  mg.moveTo(150, 138);
  mg.lineTo(141, 160);
  mg.lineTo(159, 160);
  mg.fill();

  document.getElementById('spv').textContent = Math.round(vel.length() * 3.6);
  document.getElementById('dist').textContent = district(pos.x, pos.z);
  document.querySelector('#hp i').style.width = health * 100 + '%';

  const d = pos.distanceTo(ESTOP);
  document.getElementById('obj').textContent = d < 20
    ? 'Objective complete! Top of the Empire State'
    : `Reach the Empire State spire · ${Math.round(d)} m`;
}

/* ================= 3D MODEL PREVIEW & LOOP ================= */
// Load initial suit for immediate 3D viewing on start
loadHero(SUITS[suitKey]);

// Interactive 3D Model drag-to-rotate in Menu
let menuRot = 0;
let isDraggingMenu = false, lastMenuX = 0;
window.addEventListener('pointerdown', e => {
  if (!playing && !e.target.closest('#suits') && !e.target.closest('#play')) {
    isDraggingMenu = true;
    lastMenuX = e.clientX;
  }
});
window.addEventListener('pointermove', e => {
  if (!playing && isDraggingMenu) {
    const dx = e.clientX - lastMenuX;
    menuRot += dx * 0.008;
    lastMenuX = e.clientX;
  }
});
window.addEventListener('pointerup', () => isDraggingMenu = false);
window.addEventListener('pointercancel', () => isDraggingMenu = false);

document.getElementById('play').onclick = async () => {
  initAudio();
  if (!hero.children.length) {
    await loadHero(SUITS[suitKey]);
  }
  document.getElementById('hname').textContent = 'SPIDER-MAN · ' + SUITS[suitKey].name;
  document.getElementById('menu').style.display = 'none';
  document.getElementById('hud').style.display = 'block';

  if (isTouch) {
    document.getElementById('touch').style.display = 'block';
    document.getElementById('tip').style.display = 'none';
    document.documentElement.requestFullscreen?.().catch(() => {});
  } else {
    renderer.domElement.requestPointerLock();
  }
  playing = true;
};

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .033);

  for (const c of cars) {
    c.g.position.z += c.dir * c.sp * dt;
    if (c.g.position.z > ZMAX) c.g.position.z = ZMIN;
    if (c.g.position.z < ZMIN) c.g.position.z = ZMAX;
  }

  if (playing) {
    showcaseLight.intensity = 0;
    showcaseRim.intensity = 0;
    update(dt / 2);
    update(dt / 2);
    afterPhysics();
    updateCamera(dt);
    drawHUD(dt);
  } else {
    showcaseLight.intensity = 2.5;
    showcaseRim.intensity = 1.8;
    if (!isDraggingMenu) menuRot += dt * 0.45;
    hero.position.set(0, 0, 150);
    hero.rotation.y = menuRot;
    camera.position.set(0, 1.15, 153.3);
    camera.lookAt(0, 0.95, 150);
    sky.position.copy(camera.position);
  }

  composer ? composer.render() : renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer?.setSize(innerWidth, innerHeight);
});
</script>
